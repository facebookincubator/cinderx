name: Install LLVM 22
description: Install LLVM 22 on Windows.

runs:
  using: composite
  steps:
    - name: Install LLVM 22
      shell: pwsh
      run: |
        # windows-latest (Windows Server 2025 with Visual Studio 2026)
        # ships LLVM 20.1.8, but the MSVC 14.52 STL rejects clang-cl
        # older than Clang 22 (error STL1000). Install LLVM 22 over the
        # preinstalled copy so setup.py's clang-cl lookup finds a
        # compiler the STL accepts. cibuildwheel builds Windows wheels
        # directly on the host, so the updated PATH applies to the build.
        $ProgressPreference = 'SilentlyContinue'
        $llvmVersion = '22.1.0'
        $installer = Join-Path $env:RUNNER_TEMP "LLVM-${llvmVersion}-win64.exe"
        Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvmVersion}/LLVM-${llvmVersion}-win64.exe" -OutFile $installer
        $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
        if ($process.ExitCode -ne 0) {
          throw "LLVM installer exited with code $($process.ExitCode)"
        }
        $llvmBin = 'C:\Program Files\LLVM\bin'
        Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
        $versionOutput = & "$llvmBin\clang-cl.exe" --version
        $firstLine = $versionOutput | Select-Object -First 1
        if ($firstLine -notmatch 'clang version (\d+)\.') {
          throw "Could not parse clang-cl version from: $firstLine"
        }
        if ([int]$Matches[1] -lt 22) {
          throw "clang-cl $($Matches[1]) is too old: the Visual Studio 2026 STL requires Clang 22 or newer (STL1000); got: $firstLine"
        }
        Write-Host $firstLine
